<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字号收敛 · design-studio</title>
<!--
  design-studio 的字号收敛页：在真实页面上看全站字号散不散、并成几档以后长什么样。
  做法：只在 iframe 里给「带文字的元素」加行内 font-size（按它原来的计算字号查当前方案的映射），页面原文件一个字不改；按住「看原样」临时去掉。
  页面按 100% 实际大小显示，不缩放（缩放后判断字号会偏）。审哪些页面、哪些字不动、哪些锁定、有哪几套方案，来自站点配置的 scale 字段（GET /api/config）。
  选定的方案存进反馈（POST /api/feedback），也能「复制给 AI」去改源码。
-->
<link rel="stylesheet" href="editor.css">
<link rel="icon" href="data:,">
<style>
.scale-work { position: relative; display: block; min-height: 0; }
.scale-work .stage { position: absolute; inset: 0; }
.frame-box iframe { background: var(--bg); }
a.btn { text-decoration: none; }
#tip { position: fixed; z-index: 30; pointer-events: none; padding: 6px 9px; border-radius: var(--r-xs); background: var(--tip-bg); color: var(--tip-fg); font: var(--fs-12)/1.5 var(--font-mono); white-space: nowrap; box-shadow: var(--card-shadow); }
#tip b { font-weight: 500; color: #cadd21; }
.sp { position: absolute; right: var(--sp-16); top: var(--sp-16); bottom: var(--sp-16); z-index: 20; width: 344px; max-width: calc(100% - 32px); display: flex; flex-direction: column;
  border: var(--bw) solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--surface) 95%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: var(--card-shadow); font-size: var(--fs-13); color: var(--fg-2); }
.sp.min { bottom: auto; }
.sp.min .sp-body, .sp.min .sp-ft { display: none; }
.sp-hd { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); padding: var(--sp-12) 14px; border-bottom: var(--bw) solid var(--line); }
.sp-hd b { font-size: var(--fs-14); color: var(--fg); }
.sp-hd button { border: 0; background: none; color: var(--muted); font-size: var(--fs-12); cursor: pointer; padding: 0; }
.sp-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-4) 14px 14px; }
.sec { padding: var(--sp-12) 0; border-bottom: var(--bw) solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h4 { margin: 0 0 var(--sp-8); font-size: var(--fs-13); color: var(--fg); display: flex; justify-content: space-between; gap: var(--sp-8); }
.sec h4 i { font-style: normal; font-weight: 400; color: var(--muted); }
.pre { display: flex; flex-wrap: wrap; gap: var(--sp-6); }
.pre button { height: 28px; padding: 0 11px; border: var(--bw) solid var(--line-strong); border-radius: var(--r-pill); background: transparent; color: var(--fg-2); font-size: var(--fs-12); cursor: pointer; }
.pre button:hover { background: var(--surface-2); }
.pre button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-ink); }
.pre button em { font-style: normal; font-size: 11px; color: var(--accent-ink); margin-left: 4px; }
.note { margin: var(--sp-8) 0 0; font-size: var(--fs-12); line-height: 1.6; color: var(--muted); }
.hold { margin-top: 10px; width: 100%; height: 32px; border: var(--bw) solid var(--line-strong); border-radius: var(--r-xs); background: transparent; color: var(--fg-2); font-size: var(--fs-12); cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
.hold:hover { background: var(--surface-2); }
.hold:active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chk { display: flex; align-items: center; gap: var(--sp-6); margin-top: 10px; cursor: pointer; }
.chk input { accent-color: var(--accent-ink); }
.stat { margin-top: 10px; padding: var(--sp-8) 10px; border-radius: var(--r-xs); background: var(--surface-2); font-size: var(--fs-12); line-height: 1.7; color: var(--fg-2); }
.stat b { font-family: var(--font-mono); font-weight: 500; color: var(--fg); }
.steps { display: grid; gap: var(--sp-6); }
.step { display: grid; grid-template-columns: 58px 1fr; gap: var(--sp-8); align-items: center; }
.step input { width: 58px; height: 28px; padding: 0 6px; border: var(--bw) solid var(--line-strong); border-radius: var(--r-xs); background: var(--bg); color: var(--fg); font: 500 var(--fs-13) var(--font-mono); }
.step input:disabled { opacity: .5; }
.step span { font-size: var(--fs-12); line-height: 1.45; color: var(--muted); }
table { width: 100%; border-collapse: collapse; }
td { padding: 5px 0; border-top: var(--bw) solid var(--line); vertical-align: middle; }
td.v { width: 52px; font: 500 var(--fs-13) var(--font-mono); color: var(--fg); }
td.n { width: 30px; font: var(--fs-12) var(--font-mono); color: var(--muted); text-align: right; padding-right: var(--sp-8); }
td.s { font-size: var(--fs-12); color: var(--muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: var(--sp-8); }
td.m { width: 104px; }
td.m select { width: 100%; height: 28px; font-size: var(--fs-12); padding: 0 4px; }
td.m select:disabled { opacity: .5; }
tr.chg td.v { color: var(--accent-ink); }
textarea { width: 100%; min-height: 60px; padding: var(--sp-8) 10px; border: var(--bw) solid var(--line-strong); border-radius: var(--r-xs); background: var(--bg); color: var(--fg); resize: vertical; font-size: var(--fs-13); line-height: 1.6; }
.sp-ft { display: flex; align-items: center; gap: var(--sp-8); padding: 10px 14px; border-top: var(--bw) solid var(--line); }
.sp-ft span { flex: 1; font-size: var(--fs-12); color: var(--muted); text-align: right; }
</style>
</head>
<body>
<header class="bar">
  <span class="brand" id="brand">design-studio</span>
  <span class="status">字号收敛</span>
  <label class="field"><span>页面</span><select id="page"></select></label>
  <div class="seg" id="vp" role="group" aria-label="视口"></div>
  <button type="button" class="btn icon" id="theme" title="切换页面深浅色" aria-label="切换页面深浅色" hidden>
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
  <span class="status" id="status">连接中…</span>
  <a class="btn sm" href="./" style="margin-left:auto">回编辑器</a>
</header>

<div class="scale-work">
  <div class="stage" id="stage">
    <div class="frame-box" id="frameBox"><iframe id="frame" title="被检查的页面"></iframe></div>
  </div>
  <aside class="sp" id="panel" aria-label="字号收敛面板">
    <div class="sp-hd"><b>字号收敛</b><button type="button" id="min">收起</button></div>
    <div class="sp-body">
      <section class="sec">
        <h4>方案<i>先点一套，再微调</i></h4>
        <div class="pre" id="pre"></div>
        <p class="note" id="pnote"></p>
        <button type="button" class="hold" id="hold">按住看原样</button>
        <label class="chk"><input type="checkbox" id="mark" checked> 红虚线标出刻度外的字</label>
        <div class="stat" id="stat">页面载入中…</div>
      </section>
      <section class="sec">
        <h4>刻度<i>每档几像素，可改</i></h4>
        <div class="steps" id="steps"></div>
      </section>
      <section class="sec">
        <h4>这页用到的字号<i>原字号 · 个数 · 并到</i></h4>
        <table><tbody id="map"></tbody></table>
        <p class="note" id="keepNote"></p>
      </section>
      <section class="sec">
        <h4>备注<i>想单独处理的地方写这里</i></h4>
        <textarea id="note" placeholder="比如：卡片标题想要 20，不要 24"></textarea>
      </section>
    </div>
    <div class="sp-ft"><button type="button" class="btn sm" id="copy">复制给 AI</button><button type="button" class="btn sm" id="reset">回到方案默认</button><span id="st"></span></div>
  </aside>
</div>
<div id="tip" hidden></div>
<script src="scale.js"></script>
</body>
</html>
