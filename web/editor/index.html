<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design-studio</title>
<!--
  design-studio 页面模式的编辑器：在真实页面上点选元素，改文字、调样式（只能选站点设计规范里的值）、写意见，点保存直写文件夹。
  必须通过本机服务打开：python3 design_studio.py serve <站点配置.json>，然后访问它打印的地址。
  被编辑的页面用 iframe 原样加载，页面原文件不改；站点专属的东西（面板选项、元素名称、主题切换）都来自站点配置（/api/config）。
-->
<link rel="stylesheet" href="editor.css">
<link rel="icon" href="data:,">
</head>
<body>
<header class="bar">
  <span class="brand" id="brand">design-studio</span>
  <label class="field"><span>页面</span><select id="page"></select></label>
  <div class="seg" id="vp" role="group" aria-label="视口"></div>
  <div class="seg" id="mode" role="group" aria-label="模式">
    <button type="button" data-mode="select" aria-pressed="true" title="点选元素，双击文字直接改；页面上的链接和按钮不响应">选择</button>
    <button type="button" data-mode="browse" title="页面照常可点、可交互">浏览</button>
  </div>
  <button type="button" class="btn icon" id="theme" title="切换页面深浅色" aria-label="切换页面深浅色" hidden>
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
  <span class="status" id="status">连接中…</span>
  <a class="btn sm" id="toScale" href="scale.html" title="看全站字号散不散、并成几档以后长什么样">字号收敛</a>
  <button type="button" class="btn" id="save" disabled>保存 <b id="count">0</b></button>
</header>

<div class="work">
  <div class="stage" id="stage">
    <div class="frame-box" id="frameBox"><iframe id="frame" title="被编辑的页面"></iframe></div>
  </div>

  <aside class="panel" aria-label="编辑面板">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="cur" aria-selected="true">当前元素</button>
      <button type="button" role="tab" data-tab="todo">本轮 <b id="todoN">0</b></button>
      <button type="button" role="tab" data-tab="sheet">修改单 <b id="sheetN">0</b></button>
    </nav>

    <section class="tab-body" data-body="cur" id="cur">
      <div class="hint" id="hint">
        <p><b>点页面上的任意元素</b>选中它，右边会出现能改的东西。</p>
        <p><b>双击文字</b>直接在页面上改，回车结束，Esc 放弃。</p>
        <p>想让页面照常可点（翻卡片、点链接），切到上面的「浏览」。</p>
        <p>点<b>保存</b>后：能写回的文字直接写进源文件，刷新就是新的；样式、意见和写不回的文字进修改单，交给 AI 落地。</p>
      </div>
      <div id="sel" hidden>
        <div class="sel-head">
          <p class="sel-label" id="selLabel"></p>
          <p class="sel-desc" id="selDesc"></p>
          <div class="sel-nav">
            <button type="button" class="btn sm" id="up">选上一层</button>
            <button type="button" class="btn sm" id="locate">在页面上定位</button>
          </div>
        </div>
        <div class="group" id="textGroup">
          <h3>文字</h3>
          <p class="note" id="textNote"></p>
          <button type="button" class="btn sm" id="editText">在页面上编辑</button>
        </div>
        <div class="group">
          <h3>样式 <small>只能选设计规范里的值</small></h3>
          <div id="controls"></div>
        </div>
        <div class="group">
          <h3>意见 <small>不好直接改的，写下来交给 AI</small></h3>
          <textarea id="opinion" rows="3" placeholder="比如：这里太挤了，想和上面拉开一点；或者换成三列"></textarea>
          <button type="button" class="btn sm" id="addOpinion">记下这条意见</button>
        </div>
      </div>
    </section>

    <section class="tab-body" data-body="todo" id="todo" hidden></section>
    <section class="tab-body" data-body="sheet" id="sheet" hidden></section>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="editor.js"></script>
</body>
</html>
